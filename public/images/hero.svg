<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="55%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>

  <!-- 地层：越深越密 -->
  <g stroke="#ffffff" fill="none" stroke-linecap="round">
    <path d="M120 150 H1080" stroke-width="6" opacity="0.28"/>
    <path d="M180 215 H1020" stroke-width="6" opacity="0.24"/>
    <path d="M240 280 H960" stroke-width="6" opacity="0.20"/>
    <path d="M300 345 H900" stroke-width="6" opacity="0.16"/>
    <path d="M360 410 H840" stroke-width="6" opacity="0.13"/>
    <path d="M420 475 H780" stroke-width="6" opacity="0.10"/>
  </g>

  <!-- 钻头 -->
  <g transform="translate(600 40)">
    <rect x="-16" y="0" width="32" height="150" rx="6" fill="#ffffff" opacity="0.95"/>
    <rect x="-30" y="18" width="60" height="16" rx="6" fill="#ffffff" opacity="0.75"/>
    <rect x="-30" y="52" width="60" height="16" rx="6" fill="#ffffff" opacity="0.75"/>
    <rect x="-30" y="86" width="60" height="16" rx="6" fill="#ffffff" opacity="0.75"/>
    <path d="M-34 150 L34 150 L0 232 Z" fill="#ffffff"/>
    <path d="M-18 168 L18 168 L0 200 Z" fill="#ea580c" opacity="0.5"/>
  </g>

  <!-- 核心辉光 -->
  <circle cx="600" cy="300" r="46" fill="#fde68a" opacity="0.18"/>
  <circle cx="600" cy="300" r="22" fill="#fde68a" opacity="0.85"/>
</svg>
